---
# Valores por defecto del rol zt_baseline.
#
# Cada variable acá corresponde a un control específico del perfil
# pyme-basico (ver ztstart/config/perfiles/pyme_basico.yaml). El comentario
# junto a cada una indica el ID del control CIS que implementa, para que se
# pueda trazar de vuelta al benchmark original.

# cis_1.1.1.1 — Deshabilitar sistemas de archivos no usados
zt_baseline_filesystems_a_deshabilitar:
  - cramfs
  - freevxfs
  - jffs2
  - hfs
  - hfsplus
  - squashfs
  - udf
  - usb-storage

# cis_3.1.1 — Deshabilitar IP forwarding (este sistema no es un router/gateway)
zt_baseline_deshabilitar_ip_forwarding: true

# cis_3.3 — Endurecimiento de la pila de red (sysctls anti-spoofing/redirect/DoS)
zt_baseline_aplicar_endurecimiento_pila_red: true
zt_baseline_sysctl_endurecimiento_red_ipv4:
  - { name: net.ipv4.conf.all.accept_redirects, value: "0" }
  - { name: net.ipv4.conf.default.accept_redirects, value: "0" }
  - { name: net.ipv4.conf.all.secure_redirects, value: "0" }
  - { name: net.ipv4.conf.default.secure_redirects, value: "0" }
  - { name: net.ipv4.conf.all.send_redirects, value: "0" }
  - { name: net.ipv4.conf.default.send_redirects, value: "0" }
  - { name: net.ipv4.conf.all.accept_source_route, value: "0" }
  - { name: net.ipv4.conf.default.accept_source_route, value: "0" }
  - { name: net.ipv4.conf.all.rp_filter, value: "1" }
  - { name: net.ipv4.conf.default.rp_filter, value: "1" }
  - { name: net.ipv4.tcp_syncookies, value: "1" }
  - { name: net.ipv4.icmp_echo_ignore_broadcasts, value: "1" }
  - { name: net.ipv4.icmp_ignore_bogus_error_responses, value: "1" }
# Estos solo se aplican si el sistema tiene IPv6 habilitado (ver
# cis_3_3_endurecimiento_pila_red.yml) — un servidor con IPv6 deshabilitado
# a propósito no tiene estas rutas en /proc/sys y no debería fallar por eso.
zt_baseline_sysctl_endurecimiento_red_ipv6:
  - { name: net.ipv6.conf.all.accept_redirects, value: "0" }
  - { name: net.ipv6.conf.default.accept_redirects, value: "0" }
  - { name: net.ipv6.conf.all.accept_source_route, value: "0" }
  - { name: net.ipv6.conf.default.accept_source_route, value: "0" }
  - { name: net.ipv6.conf.all.accept_ra, value: "0" }
  - { name: net.ipv6.conf.default.accept_ra, value: "0" }

# cis_5.2.1 — Permisos del archivo de configuración de SSH
zt_baseline_sshd_config_ruta: /etc/ssh/sshd_config
zt_baseline_sshd_config_propietario: root
zt_baseline_sshd_config_grupo: root
zt_baseline_sshd_config_permisos: "0600"

# cis_5.4.1 — Política mínima de contraseñas (vía /etc/login.defs)
zt_baseline_password_max_dias: 365
zt_baseline_password_min_dias: 1
zt_baseline_password_min_longitud: 14

# cis_paquetes_seguridad — Instalar herramientas recomendadas / remover
# paquetes innecesarios (ver comentario completo en la tarea)
zt_baseline_gestionar_paquetes_seguridad: true
zt_baseline_paquetes_seguridad_instalar:
  - aide
  - apparmor-utils
  - systemd-journal-remote
  - iptables
  - ufw
  - chrony
zt_baseline_paquetes_seguridad_remover:
  - rsync
  - inetutils-telnet
  - rpcbind
